name: ci

# Every gate this repository has, in the order that fails fastest.
#
# The ordering is the point. Typecheck and lint run first because they take seconds
# and catch the most; the unit suite is next; integration last because it needs a
# database and takes the best part of half an hour. A run that fails at the lint step
# should cost about a minute, not half an hour.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  # A newer push makes an in-flight run for the same branch irrelevant. Without this a
  # queue of stale runs delays the answer everyone is actually waiting for.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmarcharbor
          POSTGRES_PASSWORD: dmarcharbor
          POSTGRES_DB: dmarcharbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmarcharbor -d dmarcharbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dmarcharbor:dmarcharbor@localhost:5432/dmarcharbor
      REPORT_INGEST_SECRET: ci-report-ingest-secret-not-a-real-value
      STAFF_API_KEY: ci-staff-key-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test --workspace @dmarcharbor/api

      - name: Apply migrations
        # Integration tests truncate tables rather than create them, so a run
        # against an empty database fails in ways that have nothing to do with the
        # change under test.
        run: npm run db:deploy --workspace @dmarcharbor/api

      - name: Integration tests
        # Serialised. The suite shares one database and every file truncates the same
        # tables, so parallel files fail each other in ways that look like product
        # bugs.
        run: npm run test:integration --workspace @dmarcharbor/api

      - name: Build
        run: npm run build --workspace @dmarcharbor/api

      # A migration that runs mid-rotation breaks the old binary.
      #
      # The container's entrypoint applies migrations before it listens, and the
      # previous replicas are still serving, so the new replica migrates the
      # schema while the old code is still writing against the previous one.
      # `20261002150000_domain_slug` took `slug` to NOT NULL with no default and
      # the old binary's INSERT omits the column, so every domain-creating route
      # 500s for the whole roll window while /health says ok.
      #
      # This check rejects that shape in any migration newer than the marker, so
      # it does not retroactively fail the ones before it. Adding a migration that
      # needs to be exempt is a decision to record, hence the marker prefix.
      # A migration that runs mid-rotation breaks the old binary.
      #
      # The container entrypoint applies migrations before it listens, and the
      # previous replicas are still serving, so the new replica migrates the
      # schema while the old code is still writing against the previous one.
      # `20261002150000_domain_slug` took `slug` to NOT NULL with no default and
      # the old binary's INSERT omits the column, so every domain-creating route
      # 500s for the whole roll window while /health says ok.
      #
      # `scripts/migration-baseline` names the last grandfathered migration.
      # `scripts/check-migration-safety.sh` is the same script and runs locally.
      - name: Migrations are expand/contract safe
        run: bash scripts/check-migration-safety.sh

      - name: Build the web application
        # The web app is built here for the first time. It had never been built in CI,
        # which is part of how a broken contract reached a user: the API was changed to
        # require two fields on workspace creation, every backend test was updated to
        # send them, and the web client kept sending the old shape. Nothing in this
        # pipeline compiled the thing that was actually broken.
        #
        # A Next.js build also type checks, so this is the gate that catches a server
        # action or client call that no longer matches the API's shape.
        run: npm run build --workspace @dmarcharbor/web
        env:
          # The build must not need a live API. Anything that reaches for one at build
          # time is a bug that would otherwise only appear on the deploy machine.
          API_BASE_URL: http://localhost:4000

      - name: Dependency audit
        # Blocking, because it currently reports zero vulnerabilities for production
        # dependencies and there is nothing to be lenient about.
        #
        # The usual argument for making this advisory rather than gating is that a
        # pipeline blocked on every transitive advisory gets switched off, and a
        # switched-off pipeline audits nothing. That argument is about a nonzero
        # count. The first advisory to land will either be fixed or will need this
        # line deliberately weakened, in which case the decision is visible in the
        # diff instead of arriving quietly.
        run: npm audit --audit-level=high --omit=dev

      - name: Verify the container builds
        # A Dockerfile that has never been built is a Dockerfile that does not work.
        run: docker compose build api