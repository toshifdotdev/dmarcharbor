name: ci

# Every gate this repository has, in the order that fails fastest.
#
# The ordering is the point. Typecheck and lint run first because they take seconds
# and catch the most; the unit suite is next; integration last because it needs a
# database and takes the best part of half an hour. A run that fails at the lint step
# should cost about a minute, not half an hour.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  # A newer push makes an in-flight run for the same branch irrelevant. Without this a
  # queue of stale runs delays the answer everyone is actually waiting for.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dmarcharbor
          POSTGRES_PASSWORD: dmarcharbor
          POSTGRES_DB: dmarcharbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dmarcharbor -d dmarcharbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dmarcharbor:dmarcharbor@localhost:5432/dmarcharbor
      REPORT_INGEST_SECRET: ci-report-ingest-secret-not-a-real-value
      STAFF_API_KEY: ci-staff-key-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test --workspace @dmarcharbor/api

      - name: Apply migrations
        # Integration tests truncate tables rather than create them, so a run
        # against an empty database fails in ways that have nothing to do with the
        # change under test.
        run: npm run db:deploy --workspace @dmarcharbor/api

      - name: Integration tests
        # Serialised. The suite shares one database and every file truncates the same
        # tables, so parallel files fail each other in ways that look like product
        # bugs.
        run: npm run test:integration --workspace @dmarcharbor/api

      - name: Build
        run: npm run build --workspace @dmarcharbor/api

      # A migration that runs mid-rotation breaks the old binary.
      #
      # The container's entrypoint applies migrations before it listens, and the
      # previous replicas are still serving, so the new replica migrates the
      # schema while the old code is still writing against the previous one.
      # `20261002150000_domain_slug` took `slug` to NOT NULL with no default and
      # the old binary's INSERT omits the column, so every domain-creating route
      # 500s for the whole roll window while /health says ok.
      #
      # This check rejects that shape in any migration newer than the marker, so
      # it does not retroactively fail the ones before it. Adding a migration that
      # needs to be exempt is a decision to record, hence the marker prefix.
      # A migration that runs mid-rotation breaks the old binary.
      #
      # The container entrypoint applies migrations before it listens, and the
      # previous replicas are still serving, so the new replica migrates the
      # schema while the old code is still writing against the previous one.
      # `20261002150000_domain_slug` took `slug` to NOT NULL with no default and
      # the old binary's INSERT omits the column, so every domain-creating route
      # 500s for the whole roll window while /health says ok.
      #
      # `scripts/migration-baseline` names the last grandfathered migration.
      # `scripts/check-migration-safety.sh` is the same script and runs locally.
      - name: Migrations are expand/contract safe
        run: bash scripts/check-migration-safety.sh

      - name: Build the web application
        # The web app is built here for the first time. It had never been built in CI,
        # which is part of how a broken contract reached a user: the API was changed to
        # require two fields on workspace creation, every backend test was updated to
        # send them, and the web client kept sending the old shape. Nothing in this
        # pipeline compiled the thing that was actually broken.
        #
        # A Next.js build also type checks, so this is the gate that catches a server
        # action or client call that no longer matches the API's shape.
        run: npm run build --workspace @dmarcharbor/web
        env:
          # The build must not need a live API. Anything that reaches for one at build
          # time is a bug that would otherwise only appear on the deploy machine.
          API_BASE_URL: http://localhost:4000

      - name: Dependency audit
        # Blocking, because it currently reports zero vulnerabilities for production
        # dependencies and there is nothing to be lenient about.
        #
        # The usual argument for making this advisory rather than gating is that a
        # pipeline blocked on every transitive advisory gets switched off, and a
        # switched-off pipeline audits nothing. That argument is about a nonzero
        # count. The first advisory to land will either be fixed or will need this
        # line deliberately weakened, in which case the decision is visible in the
        # diff instead of arriving quietly.
        run: npm audit --audit-level=high --omit=dev

      - name: Verify the container builds
        # A Dockerfile that has never been built is a Dockerfile that does not work.
        #
        # The variables come from compose.yaml's `${VAR:?}` list, so they have to
        # exist here too. Without them compose refuses to start and the step fails
        # for a configuration reason rather than a build reason.
        env:
          BETTER_AUTH_SECRET: "ci-better-auth-secret-not-used-for-real-auth"
          BETTER_AUTH_URL: "https://api.ci.local.test"
          APP_URL: "https://app.ci.local.test"
          CORS_ORIGIN: "https://app.ci.local.test"
          REPORT_INGEST_SECRET: "ci-report-ingest-secret-not-used-for-real"
          FORENSIC_PSEUDONYM_SECRET: "ci-forensic-pseudonym-secret-not-used-for-real"
          FORENSIC_PII_ENCRYPTION_KEY: "ci-forensic-pii-encryption-key-not-used-for-real"
          REPORT_AGGREGATE_ADDRESS: "reports@ci.local.test"
          REPORT_FORENSIC_ADDRESS: "forensics@ci.local.test"
          EMAIL_FROM: "no-reply@ci.local.test"
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: "ci-resend-key"
          TRUST_PROXY_HOPS: "0"
        run: docker compose build api

      # A container that has never been started is a container that does not start.
      #
      # The entrypoint runs `prisma migrate deploy` before `node dist/server.js`,
      # and the readiness gate in server.ts refuses to listen on an unfinished
      # schema. Neither is executed by anything else here: the other steps run the
      # source in place, and "Build" compiles the TypeScript but never runs the
      # process. A broken entrypoint - a missing openssl, a command typo, an
      # env guard that fires on a valid production config - ships otherwise.
      #
      # The base variables need the same `?` treatment as compose.yaml so a
      # missing one reads as a configuration error rather than as a container
      # crash.
      - name: Verify the container boots and reports readiness
        # The variables come from compose.yaml's `${VAR:?}` list, so they have to
        # exist in the step too; without them compose refuses to start at all and
        # the step would pass for the wrong reason.
        env:
          BETTER_AUTH_SECRET: "ci-better-auth-secret-not-used-for-real-auth"
          BETTER_AUTH_URL: "https://api.ci.local.test"
          APP_URL: "https://app.ci.local.test"
          CORS_ORIGIN: "https://app.ci.local.test"
          REPORT_INGEST_SECRET: "ci-report-ingest-secret-not-used-for-real"
          FORENSIC_PSEUDONYM_SECRET: "ci-forensic-pseudonym-secret-not-used-for-real"
          FORENSIC_PII_ENCRYPTION_KEY: "ci-forensic-pii-encryption-key-not-used-for-real"
          REPORT_AGGREGATE_ADDRESS: "reports@ci.local.test"
          REPORT_FORENSIC_ADDRESS: "forensics@ci.local.test"
          EMAIL_FROM: "no-reply@ci.local.test"
          EMAIL_PROVIDER: resend
          RESEND_API_KEY: "ci-resend-key"
          TRUST_PROXY_HOPS: "0"
          # The container runs on the compose network, so the job's Postgres
          # service is reachable by its service name rather than by `localhost`.
          DATABASE_URL: "postgresql://dmarcharbor:dmarcharbor@postgres:5432/dmarcharbor"
        run: |
          set -e
          # `docker run` rather than `compose run`, because compose offers no way
          # to place this container on the runner's network and the job's Postgres
          # is a plain service container on localhost:5432. `--network host` is
          # what makes it reachable, and it also means the healthcheck in the
          # Dockerfile polls the right address.
          #
          # `docker compose build api` above produced the image; `docker run`
          # starts it with the entrypoint unchanged, which is the point: migrate
          # deploy, then the readiness gate.
          container="harbor-ci-api"
          docker rm -f "$container" 2>/dev/null || true
          docker run -d --name "$container" --network host \
            -e NODE_ENV=production -e PORT=4000 \
            -e DATABASE_URL="postgresql://dmarcharbor:dmarcharbor@localhost:5432/dmarcharbor" \
            -e BETTER_AUTH_SECRET="ci-better-auth-secret-not-used-for-real-auth" \
            -e BETTER_AUTH_URL="https://api.ci.local.test" \
            -e APP_URL="https://app.ci.local.test" \
            -e CORS_ORIGIN="https://app.ci.local.test" \
            -e REPORT_INGEST_SECRET="ci-report-ingest-secret-not-used-for-real" \
            -e FORENSIC_PSEUDONYM_SECRET="ci-forensic-pseudonym-secret-not-used-for-real" \
            -e FORENSIC_PII_ENCRYPTION_KEY="ci-forensic-pii-encryption-key-not-used-for-real" \
            -e REPORT_AGGREGATE_ADDRESS="reports@ci.local.test" \
            -e REPORT_FORENSIC_ADDRESS="forensics@ci.local.test" \
            -e EMAIL_FROM="no-reply@ci.local.test" \
            -e EMAIL_PROVIDER=resend -e RESEND_API_KEY="ci-resend-key" \
            -e TRUST_PROXY_HOPS=0 \
            dmarcharbor-api:latest

          ok=""
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/ready || true)"
            if [ "$code" = "200" ]; then ok="$code"; break; fi
            sleep 5
          done
          # Always dump the log: on failure it is the only explanation, and on
          # success it is the record of migrations having run in the entrypoint.
          docker logs "$container" || true
          docker rm -f "$container" 2>/dev/null || true
          if [ "$ok" != "200" ]; then
            echo "The API container never reported a successful readiness check."
            exit 1
          fi
          echo "Container booted and /api/ready answered 200."