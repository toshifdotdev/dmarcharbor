<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 64" width="354" height="64" role="img" aria-label="DMARC Harbor">

  <g>
  <defs>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A33C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2A33C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- the scope -->
  <circle cx="32" cy="27" r="20" fill="none" stroke="#137A9B" stroke-width="4.5" opacity="0.9"/>
  <!-- the sweep, trailing behind the leading edge -->
  <path d="M32 27 48.4 15.5A20 20 0 0 1 41.4 9.3z" fill="url(#sweep)"/>
  <path d="M32 27 48.4 15.5" stroke="#F2A33C" stroke-width="4.5" stroke-linecap="round"/>
  <!-- a contact, which is the entire point of a scope -->
  <circle cx="44.1" cy="20" r="4.5" fill="#F2A33C"/>
  <!-- horizon, so the scope is sitting on the sea rather than in a void -->
  <path d="M6 56h52" stroke="#0B1F33" stroke-width="5" stroke-linecap="round"/>
  <path d="M13 62c4-3.2 8-3.2 12 0s8 3.2 12 0 8-3.2 12 0"
        stroke="#5FB6CE" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
  <text x="84" y="40" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="650"
        letter-spacing="-0.6" fill="#0B1F33">DMARC Harbor</text>
  <text x="85" y="53" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600"
        letter-spacing="3.2" fill="#137A9B">DMARC MONITORING</text>

</svg>
